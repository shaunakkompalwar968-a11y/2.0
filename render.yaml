# Render Blueprint specification for Pooja Garden
# Deploy easily via Render Dashboard: "New" -> "Blueprint" -> Connect Repository

version: "1"

services:
  # -------------------------------------------------------------
  # 1. Django 5 Backend Web Service (Django Ninja, WhiteNoise)
  # -------------------------------------------------------------
  - type: web
    name: pooja-garden-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: pooja-garden-db
          property: connectionString

  # -------------------------------------------------------------
  # 2. Next.js 15 Frontend Web Service
  # -------------------------------------------------------------
  - type: web
    name: pooja-garden-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        # Replace with your actual backend service URL after creation, or keep as:
        value: "https://pooja-garden-backend.onrender.com/api"

# ---------------------------------------------------------------
# 3. Managed PostgreSQL Database (Free Tier)
# ---------------------------------------------------------------
databases:
  - name: pooja-garden-db
    databaseName: poojagarden_db
    user: poojagarden_user
    plan: free
    region: oregon
